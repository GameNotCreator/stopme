<!--
  StopMe — Windows desktop productivity app (full redesign)

  DESIGN REASONING
  · Inspiration: Wispr Flow desktop (structure, whitespace, rounded cards, light sidebar) —
    transposed, not copied. New brand: white-dominant, near-black text, sober violet #6D5AE6.
  · Type: Schibsted Grotesk (UI) + Instrument Serif (hero moments, big countdowns).
  · Core flow ≤ 20s: select apps/sites → duration → Start Blocking. The Dashboard summarizes
    the current selection; Block Apps / Block Websites own the selection (per user choice).
  · Strict mode has a visual signature: near-black instead of violet (card border, ring,
    sidebar mini-card, STRICT badge with lock icon).
  · Service connectivity is never silent: banner states (connecting → connecting-long →
    actionable errors), status mini-card, sidebar status chip, diagnostics modal.
  · Variations are exposed in the Tweaks panel: Dashboard layout (hero / split / calm),
    session timer (ring / bar / dark), sidebar (tinted / white / rail), accent violet,
    plus simulated service states and the two out-of-app screens
    (Windows blocked-app toast, browser blocked page).
-->
